services:
  mebot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MEBOT_DATABASE_PATH: /data/mebot.sqlite3
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - mebot-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8787/health',headers={'Authorization':'Bearer '+os.environ['MEBOT_SERVICE_TOKEN']}); urllib.request.urlopen(r,timeout=5).read()"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s

volumes:
  mebot-data:
