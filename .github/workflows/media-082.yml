name: Capture MeBot public media
on:
  push:
    branches: [release/android-0.8.2]
    paths: ['.github/workflows/media-082.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch public page metadata and images with provenance
        run: |
          mkdir -p capture/images
          python3 - <<'PY'
          import datetime,hashlib,html,json,urllib.request,urllib.parse,xml.etree.ElementTree as E
          from html.parser import HTMLParser
          from pathlib import Path
          out=Path('capture');records=[];errors=[]
          class Metadata(HTMLParser):
              def __init__(self):super().__init__();self.values={}
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='meta':self.values[a.get('property') or a.get('name') or '']=a.get('content','')
          def get(url,limit=8000000):
              req=urllib.request.Request(url,headers={'User-Agent':'MeBotDocumentation/0.8.2 (https://github.com/EmmanuelMmanda/MeBot)'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  data=r.read(limit+1)
                  if len(data)>limit:raise ValueError('oversized resource')
                  return data,r.headers.get_content_type()
          def capture(key,url,rights):
              raw,mime=get(url);p=Metadata();p.feed(raw.decode('utf-8','replace'))
              image=p.values.get('og:image','')
              record={'id':key,'page':url,'title':p.values.get('og:title',''),'description':p.values.get('og:description',''),'imageUrl':image,'usage':rights,'capturedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              if image.startswith('https://'):
                  raw,mime=get(image)
                  if mime not in ['image/jpeg','image/png','image/webp']:raise ValueError('unsupported image')
                  name=key+{'image/jpeg':'.jpg','image/png':'.png','image/webp':'.webp'}[mime]
                  (out/'images'/name).write_bytes(raw);record.update(file='images/'+name,sha256=hashlib.sha256(raw).hexdigest())
              records.append(record)
          pages=[('tanzania-school','https://dailynews.co.tz/ubungo-saves-233m-in-school-furniture-repairs/','Publisher image; attributed editorial app screenshot only; not a bundled app asset.'),('nasa-stennis','https://www.nasa.gov/image-article/rs-25-engine-tests-at-nasa-stennis/','NASA page: inspect image credit. Only NASA-owned content may be bundled; no endorsement implied.'),('nasa-earth','https://science.nasa.gov/resource/earth-at-night/','NASA page: inspect image credit before any reuse.'),('ollama','https://github.com/ollama/ollama/releases/tag/v0.40.11','Repository release metadata; preview only.')]
          for key,url,rights in pages:
              try:capture(key,url,rights)
              except Exception as e:errors.append({'page':url,'error':str(e)[:200]})
          query='https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode({'action':'query','format':'json','generator':'search','gsrsearch':'Dar es Salaam skyline','gsrnamespace':6,'gsrlimit':3,'prop':'imageinfo','iiprop':'url|extmetadata','iiurlwidth':1200})
          try:
              raw,_=get(query);result=json.loads(raw)
              for index,p in enumerate(result.get('query',{}).get('pages',{}).values()):
                  i=p.get('imageinfo',[{}])[0];m=i.get('extmetadata',{});license=m.get('LicenseShortName',{}).get('value','');url=i.get('thumburl') or i.get('url','')
                  if not url.startswith('https://upload.wikimedia.org/') or license not in ['CC BY-SA 4.0','CC BY-SA 3.0','CC BY 4.0','CC BY 3.0','CC0','Public domain']:continue
                  image,mime=get(url);name=f'dar-{index}.jpg';(out/'images'/name).write_bytes(image)
                  records.append({'id':f'dar-{index}','page':i.get('descriptionurl'),'title':p['title'],'imageUrl':url,'file':'images/'+name,'license':license,'licenseUrl':m.get('LicenseUrl',{}).get('value',''),'artist':m.get('Artist',{}).get('value',''),'credit':m.get('Credit',{}).get('value',''),'sha256':hashlib.sha256(image).hexdigest(),'usage':'Licensed photograph, preserve credit and license; crop only with attribution.'})
          except Exception as e:errors.append({'page':query,'error':str(e)[:200]})
          (out/'manifest.json').write_text(json.dumps({'capturedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'records':records,'errors':errors},ensure_ascii=False,indent=2)+'\n')
          print('Images:',len(records),'Recorded failures:',len(errors))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mebot-082-public-media
          path: capture/
          retention-days: 7
