name: Publish verified MeBot 0.7.0 beta
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/publish-v070-beta.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mebot-v070-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: develop
          fetch-depth: 0
      - name: Retrieve the already-built, checksum-pinned public release
        env:
          ARTIFACT_BASE: https://sb-1ht7um8772fl.vercel.run
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mebot-release"
          cd "$RUNNER_TEMP/mebot-release"
          for file in mebot-source-import.tar.gz mebot-0.7.0-beta.1.apk mebot-0.7.0-beta.1-source.zip mebot-0.7.0-beta.1-verification.txt mebot-0.7.0-beta.1-previews.zip mebot-0.7.0-beta.1-test-results.zip SHA256SUMS.txt; do
            curl --fail --silent --show-error --location --retry 2 --max-time 120 "$ARTIFACT_BASE/$file" -o "$file"
          done
          echo '7ce36afa975413eb98852335f26b9e32b30f754cf1f74f18eab0da184125c887  mebot-source-import.tar.gz' | sha256sum -c -
          echo '4a1e1e4cb6323297dc12de795ff004e805268a4260a213c097f0d1fe7ac417ae  mebot-0.7.0-beta.1.apk' | sha256sum -c -
          sha256sum -c SHA256SUMS.txt
      - name: Import reviewed source without private profiles or build secrets
        run: |
          python3 - <<'PY'
          import json, os, pathlib, tarfile
          root = pathlib.Path.cwd()
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'mebot-release/mebot-source-import.tar.gz'
          with tarfile.open(archive, 'r:gz') as tar:
              for member in tar.getmembers():
                  p = pathlib.PurePosixPath(member.name)
                  assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
                  assert member.isfile() or member.isdir()
                  assert p.suffix.lower() not in {'.jks','.keystore','.ttf','.otf','.woff','.woff2','.apk'}
                  assert p.name not in {'.env','local.properties'}
              tar.extractall(root, filter='data')
          report = json.loads((root/'docs/verification-v070.json').read_text())
          assert report['version'] == '0.7.0-beta.1'
          for name in ['core','android','service']:
              assert report[name]['tests'] > 0 and report[name]['failures'] == 0 and report[name]['errors'] == 0
          assert report['lint_beta']['Error'] == 0 and report['lint_beta']['Fatal'] == 0
          # Retire one-off dependency bootstraps now that the actual source is present.
          for name in ['verify.yml','toolchain.yml','toolchain-retry.yml','export-dependencies.yml','kotlin-dependencies.yml']:
              (root/'.github/workflows'/name).unlink(missing_ok=True)
          PY
          python3 scripts/check-docs.py
          git diff --check
      - name: Commit source on develop and fast-forward main without rewriting history
        run: |
          set -euo pipefail
          git config user.name 'MeBot release bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release MeBot Daily 0.7.0-beta.1: rich AI, scoped recommendations and guided setup'
          git push origin HEAD:develop
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main
          git tag -a v0.7.0-beta.1 -m 'MeBot Daily 0.7.0 beta 1 - separately installed testing candidate'
          git push origin refs/tags/v0.7.0-beta.1
      - name: Publish APK, source, previews, test evidence and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.7.0-beta.1 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title 'MeBot Daily 0.7.0-beta.1 — test APK' \
            --notes-file docs/RELEASE-0.7.0-beta.1.md \
            "$RUNNER_TEMP/mebot-release/mebot-0.7.0-beta.1.apk" \
            "$RUNNER_TEMP/mebot-release/mebot-0.7.0-beta.1-source.zip" \
            "$RUNNER_TEMP/mebot-release/mebot-0.7.0-beta.1-verification.txt" \
            "$RUNNER_TEMP/mebot-release/mebot-0.7.0-beta.1-previews.zip" \
            "$RUNNER_TEMP/mebot-release/mebot-0.7.0-beta.1-test-results.zip" \
            "$RUNNER_TEMP/mebot-release/SHA256SUMS.txt"
          echo 'Published the separately installed test APK and complete public source.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: MeBot-0.7.0-beta.1-delivery
          path: ${{ runner.temp }}/mebot-release/
          retention-days: 14
          if-no-files-found: warn
