name: Publish official MeBot 0.8.2
on:
  push:
    branches: [release/android-0.8.2]
    paths: ['.github/workflows/publish-082.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: mebot-official-082
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Import only the signed public APK and reviewed publication files
        env:
          PUBLIC_RELEASE_TRANSPORT: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-ed58-81f4-8bbb-1da2cbc6c312/raw?se=2026-10-25T07%3A07%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=2e5afbf8-ec07-5014-ac24-6013fccfd62c&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-25T02%3A21%3A05Z&ske=2026-10-26T02%3A21%3A05Z&sks=b&skv=2026-02-06&sig=NuZtkAWLtLFlfYDdVQ706r7syLMddrd0X5VtyvQCglY%3D'
        run: |
          echo "::add-mask::$PUBLIC_RELEASE_TRANSPORT"
          echo "MEBOT_CI_DIR=$RUNNER_TEMP/mebot-ci" >> "$GITHUB_ENV"
          echo "MEBOT_RELEASE_DIR=$RUNNER_TEMP/mebot-release" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os,urllib.request,hashlib,zipfile,io,json,subprocess
          from pathlib import Path
          with urllib.request.urlopen(os.environ['PUBLIC_RELEASE_TRANSPORT'],timeout=60) as r:raw=r.read(25_000_001)
          assert hashlib.sha256(raw).hexdigest()=='711077e83662a6ee91311f92ed3b4f42f555d88452aa646921dfde018c2e1aa6'
          out=Path(os.environ['RUNNER_TEMP'],'mebot-release');out.mkdir()
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert set(z.namelist())=={'docs.patch','manifest.json','mebot-0.8.2.apk'}
              m=json.loads(z.read('manifest.json'));patch=z.read('docs.patch');apk=z.read('mebot-0.8.2.apk')
          assert m['testedCommit']=='36cc6ad8a59f4a1e8516f42129b0ff2577de1f70'
          assert hashlib.sha256(patch).hexdigest()==m['patchSha256']
          assert hashlib.sha256(apk).hexdigest()==m['apkSha256']=='fe7b2742b2c236b3a8cabee72c5d0d575dec11eeae5c48c1ecdddadb55e61fda'
          p=Path(os.environ['RUNNER_TEMP'],'publication.patch');p.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(p)],check=True);subprocess.run(['git','apply',str(p)],check=True)
          (out/'mebot-0.8.2.apk').write_bytes(apk)
          PY
          test "$(gh api repos/EmmanuelMmanda/MeBot/actions/runs/40170141233 --jq .conclusion)" = success
          gh run download 40170141233 --name mebot-082-independent-verification --dir "$RUNNER_TEMP/mebot-ci"
          git diff --exit-code 36cc6ad8a59f4a1e8516f42129b0ff2577de1f70 -- app core service gradle gradlew gradlew.bat gradle.properties settings.gradle.kts build.gradle.kts
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Verify signed package, original certificate and archive alignment
        run: |
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$MEBOT_RELEASE_DIR/mebot-0.8.2.apk" > "$MEBOT_RELEASE_DIR/signature-verification.txt"
          "$TOOLS/zipalign" -c -P 16 -v 4 "$MEBOT_RELEASE_DIR/mebot-0.8.2.apk" > "$MEBOT_RELEASE_DIR/alignment-verification.txt"
          "$TOOLS/aapt" dump badging "$MEBOT_RELEASE_DIR/mebot-0.8.2.apk" > "$MEBOT_RELEASE_DIR/apk-badging.txt"
          python3 - <<'PY'
          import os,zipfile
          from pathlib import Path
          out=Path(os.environ['MEBOT_RELEASE_DIR']);sig=(out/'signature-verification.txt').read_text();bad=(out/'apk-badging.txt').read_text()
          assert 'Signer #1 certificate SHA-256 digest: b1b69dcefe26c815dbaec76223b7b80be76af06ba30da774637a806a7f75e3e9' in sig
          assert 'v2 scheme (APK Signature Scheme v2): true' in sig and 'v3 scheme (APK Signature Scheme v3): true' in sig
          assert "package: name='mebot.nguli.com' versionCode='13' versionName='0.8.2'" in bad
          assert "application-label:'MeBot'" in bad and "sdkVersion:'26'" in bad and 'application-debuggable' not in bad
          with zipfile.ZipFile(Path(os.environ['MEBOT_CI_DIR'],'review-input/mebot-0.8.2-unsigned.apk')) as a,zipfile.ZipFile(out/'mebot-0.8.2.apk') as b:
              assert a.namelist()==b.namelist() and b.testzip() is None
              for name in a.namelist():assert a.read(name)==b.read(name),name
          print('Signed application entries match the tested candidate exactly.')
          PY
      - name: Check documentation and complete browser journeys
        run: |
          python3 scripts/check-docs.py
          python3 scripts/check-showcase.py
          node --check docs/site.js
          node --check docs/showcase.js
          python3 -m pip install 'playwright==1.56.0'
          python3 -m playwright install --with-deps chromium
          python3 scripts/test-showcase-browser.py
      - name: Commit the verified documentation without changing runtime sources
        run: |
          git config user.name 'MeBot release bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md START-HERE.md CHANGELOG.md AGENTS.md CONTRIBUTING.md SECURITY.md docs scripts/build.sh scripts/build-showcase.py scripts/releases/package_082.py
          git rm .github/workflows/publish-082.yml
          git commit -m 'release: official MeBot 0.8.2 guides, screenshots and verified download metadata'
          git push origin HEAD:release/android-0.8.2
          git diff --exit-code 36cc6ad8a59f4a1e8516f42129b0ff2577de1f70 HEAD -- app core service gradle gradlew gradlew.bat gradle.properties settings.gradle.kts build.gradle.kts
      - name: Package exact tagged source and evidence
        run: python3 scripts/releases/package_082.py
      - name: Create release tag and upload draft assets
        run: |
          if git rev-parse --verify refs/tags/v0.8.2 >/dev/null 2>&1; then
            echo 'Version tag already exists; refusing to rewrite history.' >&2
            exit 1
          fi
          git tag -a v0.8.2 -m 'Official MeBot 0.8.2 - mebot.nguli.com' HEAD
          git push origin refs/tags/v0.8.2
          gh api --method POST repos/EmmanuelMmanda/MeBot/releases -f tag_name=v0.8.2 -f target_commitish="$(git rev-parse HEAD)" -f name='MeBot 0.8.2' -F draft=true -F prerelease=false -F body=@docs/RELEASE-0.8.2.md > "$RUNNER_TEMP/draft-release.json"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          r=json.loads(Path(os.environ['RUNNER_TEMP'],'draft-release.json').read_text())
          assert r['tag_name']=='v0.8.2' and r['draft']
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f"MEBOT_RELEASE_ID={r['id']}\n")
          PY
          while IFS= read -r asset; do gh release upload v0.8.2 "$asset"; done < website-evidence/public-assets.txt
      - name: Verify every published byte and activate the official release
        run: |
          mkdir -p "$RUNNER_TEMP/roundtrip"
          gh release download v0.8.2 --dir "$RUNNER_TEMP/roundtrip"
          gh api "repos/EmmanuelMmanda/MeBot/releases/$MEBOT_RELEASE_ID" > "$RUNNER_TEMP/asset-review.json"
          python3 - <<'PY'
          import os,json,hashlib,zipfile,subprocess
          from pathlib import Path
          d=Path(os.environ['RUNNER_TEMP'],'roundtrip');r=json.loads(Path(os.environ['RUNNER_TEMP'],'asset-review.json').read_text());m=json.loads((d/'release-metadata.json').read_text())
          assert r['draft'] and not r['prerelease'] and r['tag_name']=='v0.8.2'
          assert m['sourceCommit']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert m['applicationId']=='mebot.nguli.com' and m['versionCode']==13 and m['minimumSdk']==26
          assets={x['name']:x for x in r['assets']}
          for item in m['assets']:
              p=d/item['name'];digest=hashlib.sha256(p.read_bytes()).hexdigest()
              assert digest==item['sha256'] and p.stat().st_size==item['bytes']
              assert assets[p.name]['digest']=='sha256:'+digest and assets[p.name]['state']=='uploaded'
              if p.suffix=='.zip':
                  with zipfile.ZipFile(p) as z:assert z.testzip() is None
          for line in (d/'SHA256SUMS.txt').read_text().splitlines():
              digest,name=line.split('  ',1);assert '/' not in name and hashlib.sha256((d/name).read_bytes()).hexdigest()==digest
          print('Every release file re-downloaded and verified.')
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$RUNNER_TEMP/roundtrip/mebot-0.8.2.apk"
          gh api --method PATCH "repos/EmmanuelMmanda/MeBot/releases/$MEBOT_RELEASE_ID" -F draft=false -F prerelease=false -f make_latest=true > "$MEBOT_RELEASE_DIR/publication.json"
          python3 - <<'PY'
          import urllib.request,hashlib
          url='https://github.com/EmmanuelMmanda/MeBot/releases/download/v0.8.2/mebot-0.8.2.apk'
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'MeBot-release-check'}),timeout=90) as r:
              digest=hashlib.sha256()
              while chunk:=r.read(1024*1024):digest.update(chunk)
          assert digest.hexdigest()=='fe7b2742b2c236b3a8cabee72c5d0d575dec11eeae5c48c1ecdddadb55e61fda'
          print('Public APK download verified without authentication.')
          PY
      - name: Promote verified release to develop and main without rewriting history
        run: |
          git fetch origin develop main
          git merge-base --is-ancestor origin/develop HEAD
          git merge-base --is-ancestor origin/main HEAD
          git push --atomic origin HEAD:develop HEAD:main
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mebot-0.8.2-complete-delivery
          path: |
            ${{ runner.temp }}/mebot-release/
            website-evidence/
          retention-days: 14
          if-no-files-found: warn
