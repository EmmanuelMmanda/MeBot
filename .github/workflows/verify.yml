name: Verify MeBot

on:
  push:
    branches: [develop, main]
    paths-ignore: ['README.md', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mebot-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore checksum-verified source snapshot when needed
        id: source
        shell: bash
        run: |
          if [ -f .bootstrap/manifest.json ] && [ ! -f app/build.gradle.kts ]; then
            python3 - <<'PY'
          import base64, hashlib, io, json, pathlib, tarfile
          root = pathlib.Path.cwd()
          manifest = json.loads((root / '.bootstrap/manifest.json').read_text())
          raw = b''.join((root / '.bootstrap' / name).read_bytes() for name in manifest['chunks'])
          payload = base64.b64decode(raw, validate=False)
          assert hashlib.sha256(payload).hexdigest() == manifest['sha256'], 'Source transport checksum mismatch'
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:xz') as archive:
              for member in archive.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
                  assert member.isfile() or member.isdir(), 'Only regular source files are allowed'
              archive.extractall(root, filter='data')
          PY
          fi
          if [ -f app/build.gradle.kts ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Source transfer is not complete. No app was built in this run.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: steps.source.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        if: steps.source.outputs.ready == 'true'
        with:
          gradle-version: '8.13'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Prepare public build assets and Android SDK
        if: steps.source.outputs.ready == 'true'
        run: |
          python3 scripts/prepare-build.py
          python3 - <<'PY'
          import subprocess
          subprocess.run(['sdkmanager', 'platforms;android-36', 'build-tools;35.0.0'], input='y\n'*30, text=True, check=True)
          PY
      - name: Verify Android and compile both variants
        if: steps.source.outputs.ready == 'true'
        run: gradle :core:test :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace -Pkotlin.incremental=false
      - name: Verify optional service
        if: steps.source.outputs.ready == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/mebot-venv"
          "$RUNNER_TEMP/mebot-venv/bin/pip" install -r service/requirements-dev.txt
          cd service
          "$RUNNER_TEMP/mebot-venv/bin/python" -m pytest -q --junitxml=test-results.xml
      - name: Collect signing and verification inputs
        if: steps.source.outputs.ready == 'true'
        run: |
          mkdir -p release-input
          cp app/build/outputs/apk/release/*unsigned.apk release-input/mebot-0.7.0-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release-input/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" release-input/
          sha256sum release-input/* > release-input/SHA256SUMS.txt
      - name: Upload unsigned release and public signing tools
        if: steps.source.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mebot-release-input
          path: release-input/
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification evidence
        if: always() && steps.source.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mebot-verification
          path: |
            core/build/test-results/
            app/build/test-results/
            app/build/reports/lint-results-*.xml
            app/build/outputs/screenshots/
            service/test-results.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Commit imported source only after all verification passes
        if: success() && steps.source.outputs.ready == 'true' && github.ref == 'refs/heads/develop' && github.event_name == 'push'
        run: |
          git config user.name 'MeBot release bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Import verified MeBot v0.7.0 source and build documentation'
            git push origin HEAD:develop
          fi
