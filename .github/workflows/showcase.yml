name: Review MeBot website
on:
  push:
    branches: [develop, main]
    paths: ['README.md', 'docs/**', 'scripts/*showcase*', 'scripts/check-docs.py', '.github/workflows/showcase.yml']
  pull_request:
    paths: ['README.md', 'docs/**', 'scripts/*showcase*', 'scripts/check-docs.py', '.github/workflows/showcase.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mebot-website-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate pages, screenshots and release links
        run: |
          python3 scripts/check-docs.py
          python3 scripts/check-showcase.py
          node --check docs/site.js
          node --check docs/showcase.js
      - name: Install browser testing
        run: |
          python3 -m pip install 'playwright==1.56.0'
          python3 -m playwright install --with-deps chromium
      - name: Test mobile, desktop and guide interaction
        run: python3 scripts/test-showcase-browser.py
      - name: Upload website evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mebot-website-review
          path: |
            website-evidence/
            docs/
          include-hidden-files: true
          retention-days: 14
