name: Check MeBot documentation
on:
  push:
    branches: [develop, main]
    paths: ['docs/**', 'README.md', 'scripts/check-docs.py']
  pull_request:
    paths: ['docs/**', 'README.md', 'scripts/check-docs.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 scripts/check-docs.py
