name: Jobs isolated Android device QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - 'scripts/verify-jobs-emulator.sh'
      - '.github/workflows/jobs-device-qa.yml'
permissions:
  contents: read
concurrency:
  group: jobs-device-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install official SDK and isolated test image
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run(['sdkmanager', 'platforms;android-36', 'build-tools;35.0.0', 'emulator', 'system-images;android-35;google_apis;x86_64'], input='y\n' * 30, text=True, check=True)
          PY
      - name: Compile device tests and exercise the isolated emulator
        run: bash scripts/verify-jobs-emulator.sh
      - name: Preserve exact-source device evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jobs-device-qa-${{ github.sha }}
          path: |
            device-qa-evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: error
          retention-days: 14
