name: Prepare Android verification tools
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths: ['.github/workflows/toolchain.yml']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Prepare a dependency-only Android project
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/seed/app/src/main" "$RUNNER_TEMP/seed/app/src/test/java" "$RUNNER_TEMP/seed/core"
          cd "$RUNNER_TEMP/seed"
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "MeBotToolchain"
          include(":app", ":core")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
            id("com.android.application") version "8.13.2" apply false
            id("org.jetbrains.kotlin.android") version "2.2.21" apply false
            id("org.jetbrains.kotlin.jvm") version "2.2.21" apply false
            id("org.jetbrains.kotlin.plugin.compose") version "2.2.21" apply false
            id("org.jetbrains.kotlin.plugin.serialization") version "2.2.21" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.incremental=false
          EOF
          cat > core/build.gradle.kts <<'EOF'
          plugins { id("org.jetbrains.kotlin.jvm"); id("org.jetbrains.kotlin.plugin.serialization") }
          kotlin { jvmToolchain(17) }
          dependencies {
            implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0")
            testImplementation("junit:junit:4.13.2")
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android"); id("org.jetbrains.kotlin.plugin.compose"); id("org.jetbrains.kotlin.plugin.serialization") }
          android {
            namespace = "app.mynguli.toolchain"
            compileSdk = 36
            defaultConfig { applicationId = "app.mynguli.toolchain"; minSdk = 26; targetSdk = 36 }
            compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
            buildFeatures { compose = true; buildConfig = true }
            testOptions { unitTests.isIncludeAndroidResources = true }
            packaging { resources.excludes += "/META-INF/{AL2.0,LGPL2.1}" }
          }
          kotlin { compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17) } }
          dependencies {
            implementation(project(":core"))
            implementation(platform("androidx.compose:compose-bom:2025.12.00"))
            implementation("androidx.core:core-ktx:1.17.0")
            implementation("androidx.activity:activity-compose:1.12.2")
            implementation("androidx.lifecycle:lifecycle-runtime-compose:2.9.4")
            implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4")
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-tooling-preview")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.material:material-icons-extended")
            implementation("androidx.datastore:datastore:1.1.7")
            implementation("androidx.work:work-runtime-ktx:2.11.2")
            implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
            implementation("com.journeyapps:zxing-android-embedded:4.3.0")
            implementation("com.google.zxing:core:3.5.3")
            debugImplementation("androidx.compose.ui:ui-tooling")
            debugImplementation("androidx.compose.ui:ui-test-manifest")
            testImplementation("junit:junit:4.13.2")
            testImplementation("org.robolectric:robolectric:4.16")
            testImplementation("androidx.test:core:1.7.0")
            testImplementation("androidx.work:work-testing:2.11.2")
            testImplementation("androidx.compose.ui:ui-test-junit4")
            testImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2")
            androidTestImplementation(platform("androidx.compose:compose-bom:2025.12.00"))
            androidTestImplementation("androidx.compose.ui:ui-test-junit4")
            androidTestImplementation("androidx.test.ext:junit:1.3.0")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Toolchain" /></manifest>
          EOF
          cat > app/src/test/java/RuntimeTest.java <<'EOF'
          import android.graphics.Bitmap;
          import org.junit.Test;
          import org.junit.runner.RunWith;
          import org.robolectric.RobolectricTestRunner;
          import org.robolectric.annotation.Config;
          import org.robolectric.annotation.GraphicsMode;
          @RunWith(RobolectricTestRunner.class)
          @Config(sdk=35)
          @GraphicsMode(GraphicsMode.Mode.NATIVE)
          public class RuntimeTest {
            @Test public void warmsNativeRuntime() { Bitmap.createBitmap(8,8,Bitmap.Config.ARGB_8888).eraseColor(0xff000000); }
          }
          EOF
          python3 - <<'PY'
          import subprocess
          subprocess.run(['sdkmanager','platforms;android-36','build-tools;35.0.0'],input='y\n'*30,text=True,check=True)
          PY
          gradle :core:test :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
      - name: Package build tools and cached dependencies
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/package/tools" "$RUNNER_TEMP/package/runtime"
          gradle --stop || true
          cp -a "$JAVA_HOME" "$RUNNER_TEMP/package/tools/jdk"
          GRADLE_DIR=$(dirname "$(dirname "$(readlink -f "$(command -v gradle)")")")
          cp -a "$GRADLE_DIR" "$RUNNER_TEMP/package/tools/gradle"
          mkdir -p "$RUNNER_TEMP/package/tools/android/platforms" "$RUNNER_TEMP/package/tools/android/build-tools"
          cp -a "$ANDROID_HOME/platforms/android-36" "$RUNNER_TEMP/package/tools/android/platforms/"
          cp -a "$ANDROID_HOME/build-tools/35.0.0" "$RUNNER_TEMP/package/tools/android/build-tools/"
          cp -a "$ANDROID_HOME/licenses" "$RUNNER_TEMP/package/tools/android/"
          cp -a "$HOME/.gradle/caches" "$RUNNER_TEMP/package/runtime/gradle-caches"
          if [ -d "$HOME/.m2" ]; then cp -a "$HOME/.m2" "$RUNNER_TEMP/package/runtime/m2"; fi
          if [ -d /tmp/robolectric ]; then cp -a /tmp/robolectric "$RUNNER_TEMP/package/runtime/robolectric"; fi
          find "$RUNNER_TEMP/package" -name '*.lock' -delete
          tar -czf "$RUNNER_TEMP/android-tools.tgz" -C "$RUNNER_TEMP/package" tools
          tar -czf "$RUNNER_TEMP/android-dependencies.tgz" -C "$RUNNER_TEMP/package" runtime
          sha256sum "$RUNNER_TEMP/android-tools.tgz" "$RUNNER_TEMP/android-dependencies.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: android-tools
          path: ${{ runner.temp }}/android-tools.tgz
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: android-dependencies
          path: ${{ runner.temp }}/android-dependencies.tgz
          compression-level: 0
          retention-days: 2
