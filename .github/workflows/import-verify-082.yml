name: Import and verify MeBot 0.8.2
on:
  push:
    branches: [release/android-0.8.2]
    paths: ['.github/workflows/import-verify-082.yml']
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Import checksum-pinned public source changes
        env:
          PUBLIC_SOURCE_TRANSPORT: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-871c-81f4-a270-c2e4e092a736/raw?se=2026-10-25T06%3A47%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=9f6b0da5-db1a-51ba-8034-27fca8f21322&skoid=0a4a0f0c-99ac-4752-9d87-cfac036fa93f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-25T00%3A43%3A53Z&ske=2026-10-26T00%3A43%3A53Z&sks=b&skv=2026-02-06&sig=nnUCyABjJm3B0BkVIKmbhmt0Qptvgq%2BwzwwhMxKcCy8%3D'
        run: |
          echo "::add-mask::$PUBLIC_SOURCE_TRANSPORT"
          python3 - <<'PY'
          import os,urllib.request,hashlib,zipfile,io,json,pathlib,subprocess
          # This short-lived URL carries only explicitly public source, never signing material.
          with urllib.request.urlopen(os.environ['PUBLIC_SOURCE_TRANSPORT'],timeout=40) as r: raw=r.read(1_000_001)
          assert hashlib.sha256(raw).hexdigest()=='c43c6a5e7e57fe3f10092d482362b2da86665ce85a0c8f0a53b84ba3343f4d7a'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert set(z.namelist())=={'runtime.patch','manifest.json'}
              patch=z.read('runtime.patch');manifest=json.loads(z.read('manifest.json'))
              assert hashlib.sha256(patch).hexdigest()==manifest['patchSha256']
          p=pathlib.Path(os.environ['RUNNER_TEMP'],'mebot-public.patch');p.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply',str(p)],check=True)
          PY
          git config user.name 'MeBot release bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app core scripts/build.sh docs/IMAGE-CREDITS.md docs/RELEASE-TRACKER-0.8.2.md
          git add -f docs/captures/v082/sources.json
          git rm .github/workflows/import-verify-082.yml
          git commit -m 'feat: MeBot 0.8.2 provider choices, software updates, relevance and new identity'
          git push origin HEAD:release/android-0.8.2
          mkdir -p review-input
          git rev-parse HEAD > review-input/SOURCE-COMMIT.txt
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Prepare pinned typography and dated screenshot inputs
        run: |
          python3 scripts/prepare-build.py
          gh run download 40168652739 --name mebot-082-public-media --dir "$RUNNER_TEMP/public-media"
          echo "MEBOT_CAPTURE_ASSETS=$RUNNER_TEMP/public-media" >> "$GITHUB_ENV"
      - name: Verify all core and Android tests and build official candidate
        run: gradle :core:test :app:testDebugUnitTest :app:assembleRelease :app:lintRelease --no-daemon --stacktrace -Pkotlin.incremental=false --max-workers=2
      - name: Verify optional service
        run: |
          python3 -m venv "$RUNNER_TEMP/service-venv"
          "$RUNNER_TEMP/service-venv/bin/pip" install -r service/requirements-dev.txt
          cd service
          "$RUNNER_TEMP/service-venv/bin/python" -m pytest -q --junitxml=test-results.xml
      - name: Package verified unsigned input and exact public source
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk review-input/mebot-0.8.2-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" review-input/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" review-input/
          git archive --format=zip --prefix=MeBot/ -o review-input/mebot-0.8.2-source-review.zip HEAD
          sha256sum review-input/* > review-input/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mebot-082-independent-verification
          path: |
            review-input/
            core/build/test-results/
            app/build/test-results/
            app/build/reports/lint-results-release.xml
            app/build/outputs/screenshots/v082/
            app/build/outputs/screenshots/mebot-0.8.2-background.png
            service/test-results.xml
          retention-days: 14
