name: VM observer diagnostic (not release qualification)

on:
  push:
    branches: [diagnostic/098-datastore-observation]

permissions:
  contents: read

concurrency:
  group: vm-observer-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Prepare Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install the pinned Android SDK packages
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run(
              ["sdkmanager", "platforms;android-36", "build-tools;35.0.0"],
              input="y\n" * 30,
              text=True,
              check=True,
          )
          PY

      - name: Observe the two complete VM classes
        run: |
          python3 scripts/prepare-build.py
          gradle :app:testDebugUnitTest \
            --tests mebot.nguli.com.feed.SuggestionActions097ViewModelTest \
            --tests mebot.nguli.com.feed.PersonalDailySelection098ViewModelTest \
            --no-daemon --stacktrace -Pkotlin.incremental=false \
            --init-script scripts/ci-test-observability.gradle

      - name: Upload diagnostic XML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vm-observer-diagnostic-${{ github.sha }}
          path: app/build/test-results/testDebugUnitTest/TEST-*.xml
          if-no-files-found: error
          retention-days: 7
