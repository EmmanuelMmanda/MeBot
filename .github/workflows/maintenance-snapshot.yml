name: Export maintenance source
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/maintenance-snapshot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          mkdir -p export
          git archive --format=zip HEAD -o export/mebot-current-source.zip
          git rev-parse HEAD > export/COMMIT.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mebot-maintenance-source
          path: export/
          retention-days: 7
