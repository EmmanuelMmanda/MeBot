name: Verify MeBot 0.8.1 maintenance
on:
  push:
    branches: [release/maintenance-v0.8.1]
    paths: ['.maintenance/**', '.github/workflows/maintenance-v081.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maintenance-v081
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply checksum-verified maintenance changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,lzma,subprocess
          parts=sorted(Path('.maintenance').glob('v081.[0-9][0-9]'))
          if parts:
              assert len(parts)==5
              data=b''.join(p.read_bytes() for p in parts)
              assert hashlib.sha256(data).hexdigest()=='63f78ac5d3c1a9e8c6f8baed44dfef844e7af5bdeff028e1e48b88aef0b6773a'
              patch=lzma.decompress(data)
              assert len(patch)<200_000
              subprocess.run(['git','apply','--unidiff-zero','--check','-'],input=patch,check=True)
              subprocess.run(['git','apply','--unidiff-zero','-'],input=patch,check=True)
              for p in parts:p.unlink()
          assert 'versionName = "0.8.1"' in Path('app/build.gradle.kts').read_text()
          PY
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare SDK and pinned build assets
        run: |
          python3 scripts/prepare-build.py
          python3 - <<'PY'
          import subprocess
          subprocess.run(['sdkmanager','platforms;android-36','build-tools;35.0.0'],input='y\n'*30,text=True,check=True)
          PY
      - name: Test Android and core without exclusions
        run: gradle :core:test :app:testDebugUnitTest --no-daemon --stacktrace --max-workers=2 -Dorg.gradle.parallel=false -Pkotlin.incremental=false
      - name: Build and lint official package
        run: gradle :app:assembleRelease :app:lintRelease --no-daemon --stacktrace --max-workers=2 -Dorg.gradle.parallel=false -Pkotlin.incremental=false
      - name: Verify optional service
        run: |
          python3 -m venv "$RUNNER_TEMP/service-env"
          "$RUNNER_TEMP/service-env/bin/pip" install -r service/requirements-dev.txt
          cd service
          "$RUNNER_TEMP/service-env/bin/python" -m pytest -q --junitxml=test-results.xml
      - name: Verify documentation
        run: python3 scripts/check-docs.py
      - name: Commit verified application sources
        if: success() && github.ref == 'refs/heads/release/maintenance-v0.8.1'
        run: |
          git config user.name 'MeBot release bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app core docs CHANGELOG.md .maintenance
          if ! git diff --cached --quiet; then
            git commit -m 'fix: accurate pinned activity, Tanzania discovery and verified file links'
            git push origin HEAD:release/maintenance-v0.8.1
          fi
          git rev-parse HEAD > VERIFIED-COMMIT.txt
      - name: Collect release inputs
        run: |
          mkdir -p release-input
          cp app/build/outputs/apk/release/*unsigned.apk release-input/mebot-0.8.1-unsigned.apk
          cp VERIFIED-COMMIT.txt release-input/
          git archive --format=zip HEAD > release-input/mebot-0.8.1-source-snapshot.zip
          sha256sum release-input/* > release-input/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: mebot-0.8.1-release-input
          path: release-input/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mebot-0.8.1-verification
          path: |
            core/build/test-results/
            app/build/test-results/
            app/build/reports/lint-results-*.xml
            app/build/outputs/screenshots/
            service/test-results.xml
          if-no-files-found: warn
          retention-days: 14
