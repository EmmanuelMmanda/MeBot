name: Check public source availability
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/public-source-check.yml']
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public publisher feeds
        run: |
          python3 - <<'PY'
          import concurrent.futures,json,urllib.request,xml.etree.ElementTree as ET
          urls=['https://dailynews.co.tz/feed/','https://habarileo.co.tz/feed/','https://www.tbc.go.tz/feed/','https://feeds.bbci.co.uk/swahili/rss.xml','https://www.thecitizen.co.tz/tanzania/news/national-1840392?view=asFeed','https://www.mwananchi.co.tz/mw/habari/kitaifa-1597290?view=asFeed','https://www.ajira.go.tz/','https://portal.ajira.go.tz/','https://www.udsm.ac.tz/','https://news.google.com/rss/search?q=Tanzania+when:7d&hl=en-TZ&gl=TZ&ceid=TZ:en']
          def check(url):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'MeBot/0.8.1 public-source-check','Accept':'application/rss+xml,application/atom+xml,text/html;q=0.8'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      body=r.read(2_000_000); status=r.status; content=r.headers.get('Content-Type','')
                  try:
                      root=ET.fromstring(body); count=len(root.findall('.//item'))+len(root.findall('.//{http://www.w3.org/2005/Atom}entry'))
                  except Exception: count=0
                  return {'url':url,'status':status,'type':content,'entries':count,'bytes':len(body),'prefix':body[:80].decode('utf8','replace')}
              except Exception as e: return {'url':url,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool: results=list(pool.map(check,urls))
          print(json.dumps(results,indent=2))
          open('public-source-check.json','w').write(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-source-check
          path: public-source-check.json
          retention-days: 7
