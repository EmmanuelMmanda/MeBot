name: Prepare complete Android toolchain
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/toolchain-retry.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Load dependency setup scripts
        run: |
          python3 -m pip install PyYAML
          python3 - <<'PY'
          import os, pathlib, yaml
          workflow = yaml.safe_load(pathlib.Path('.github/workflows/toolchain.yml').read_text())
          scripts = [s['run'] for s in workflow['jobs']['tools']['steps'] if 'run' in s]
          for index, script in enumerate(scripts):
              pathlib.Path(os.environ['RUNNER_TEMP'], f'mebot-toolchain-{index}.sh').write_text(script)
          PY
      - name: Warm exact Android dependencies and native test runtime
        run: bash -e "$RUNNER_TEMP/mebot-toolchain-0.sh"
      - name: Package offline Android build tools
        run: bash -e "$RUNNER_TEMP/mebot-toolchain-1.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-tools
          path: ${{ runner.temp }}/android-tools.tgz
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-dependencies
          path: ${{ runner.temp }}/android-dependencies.tgz
          compression-level: 0
          retention-days: 2
