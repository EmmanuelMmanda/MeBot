name: Publish official MeBot 0.8.1
on:
  push:
    branches: [release/publish-v0.8.1]
    paths:
      - '.github/workflows/publish-v081.yml'
      - 'release/0.8.1/**'
      - 'scripts/assemble-signed-apk.py'
      - 'scripts/prepare-release-081.py'
      - 'scripts/package-release-081.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: mebot-official-v081
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/release/publish-v0.8.1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      MEBOT_CANDIDATE_DIR: ${{ runner.temp }}/mebot-candidate
      RELEASE_DIRECTORY: ${{ runner.temp }}/mebot-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify provenance and download the tested build
        run: |
          test "$(gh api repos/EmmanuelMmanda/MeBot/actions/runs/40126322372 --jq .conclusion)" = success
          gh run download 40126322372 --repo EmmanuelMmanda/MeBot --name mebot-activity-polish-review --dir "$MEBOT_CANDIDATE_DIR"
          git diff --exit-code 59ef0bf50c4e7d5a1d66d9221535f5d571eba94f HEAD -- app core service gradle gradlew gradlew.bat gradle.properties settings.gradle.kts build.gradle.kts
          mkdir -p "$RELEASE_DIRECTORY"
          python3 scripts/assemble-signed-apk.py release/0.8.1/signed-apk.json "$MEBOT_CANDIDATE_DIR/review-input/mebot-0.8.1-unsigned.apk" "$RELEASE_DIRECTORY/mebot-0.8.1.apk"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Verify original certificate, package and alignment
        run: |
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$RELEASE_DIRECTORY/mebot-0.8.1.apk" > "$RELEASE_DIRECTORY/signature-verification.txt"
          "$TOOLS/zipalign" -c -P 16 -v 4 "$RELEASE_DIRECTORY/mebot-0.8.1.apk" > "$RELEASE_DIRECTORY/alignment-verification.txt"
          "$TOOLS/aapt" dump badging "$RELEASE_DIRECTORY/mebot-0.8.1.apk" > "$RELEASE_DIRECTORY/apk-badging.txt"
          python3 - <<'PY'
          from pathlib import Path
          import os,json
          out=Path(os.environ['RELEASE_DIRECTORY']);m=json.loads(Path('release/0.8.1/signed-apk.json').read_text())
          signature=(out/'signature-verification.txt').read_text()
          assert 'Signer #1 certificate SHA-256 digest: '+m['certificateSha256'] in signature
          assert 'Verified using v2 scheme (APK Signature Scheme v2): true' in signature
          assert 'Verified using v3 scheme (APK Signature Scheme v3): true' in signature
          badging=(out/'apk-badging.txt').read_text()
          assert "package: name='app.mynguli' versionCode='12' versionName='0.8.1'" in badging
          assert "application-label:'MeBot'" in badging
          assert "sdkVersion:'26'" in badging and 'application-debuggable' not in badging
          print('Original certificate, MeBot package/name/version, Android 8 minimum and alignment verified.')
          PY
      - name: Finalize illustrated documentation and evidence
        run: |
          python3 scripts/prepare-release-081.py
          node --check docs/site.js
          node --check docs/showcase.js
      - name: Install isolated browser test tools
        run: |
          python3 -m pip install 'playwright==1.56.0'
          python3 -m playwright install --with-deps chromium
      - name: Verify desktop, mobile, keyboard and no-script downloads
        run: python3 scripts/test-showcase-browser.py
      - name: Commit verified publication files
        run: |
          git config user.name 'MeBot release bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md docs scripts/build-showcase.py
          if ! git diff --cached --quiet; then
            git commit -m 'release: finalize official MeBot 0.8.1 documentation and downloads'
            git push origin HEAD:release/publish-v0.8.1
          fi
          git diff --exit-code 59ef0bf50c4e7d5a1d66d9221535f5d571eba94f HEAD -- app core service gradle gradlew gradlew.bat gradle.properties settings.gradle.kts build.gradle.kts
      - name: Package exact tagged source, resources and checksums
        run: python3 scripts/package-release-081.py
      - name: Publish draft release and verify the downloadable APK
        run: |
          if git rev-parse --verify refs/tags/v0.8.1 >/dev/null 2>&1; then
            test "$(git rev-parse v0.8.1^{commit})" = "$(git rev-parse HEAD)"
          else
            git tag -a v0.8.1 -m 'MeBot 0.8.1 - official original-certificate release' HEAD
            git push origin refs/tags/v0.8.1
          fi
          if gh release view v0.8.1 --json isDraft >/dev/null 2>&1; then
            test "$(gh release view v0.8.1 --json isDraft --jq .isDraft)" = true
          else
            gh release create v0.8.1 --verify-tag --draft --title 'MeBot 0.8.1' --notes-file docs/RELEASE-0.8.1.md
          fi
          while IFS= read -r asset; do
            gh release upload v0.8.1 "$asset" --clobber
          done < website-evidence/public-assets.txt
          mkdir -p "$RUNNER_TEMP/release-check"
          gh release download v0.8.1 --pattern 'mebot-0.8.1.apk' --pattern 'SHA256SUMS.txt' --pattern 'release-metadata.json' --dir "$RUNNER_TEMP/release-check"
          cmp "$RELEASE_DIRECTORY/mebot-0.8.1.apk" "$RUNNER_TEMP/release-check/mebot-0.8.1.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$RUNNER_TEMP/release-check/mebot-0.8.1.apk"
          gh api repos/EmmanuelMmanda/MeBot/releases/tags/v0.8.1 > "$RUNNER_TEMP/release-check/published.json"
          python3 - <<'PY'
          from pathlib import Path
          import os,json
          out=Path(os.environ['RELEASE_DIRECTORY']);published=json.loads(Path(os.environ['RUNNER_TEMP'],'release-check/published.json').read_text())
          meta=json.loads((out/'release-metadata.json').read_text());assets={a['name']:a for a in published['assets']}
          assert published['draft'] and not published['prerelease']
          for item in meta['assets']:
              a=assets[item['name']]
              assert a['state']=='uploaded' and a['size']==item['bytes']
              assert a['digest']=='sha256:'+item['sha256'],item['name']
          assert 'SHA256SUMS.txt' in assets and 'release-metadata.json' in assets
          print('All public asset sizes/digests and the re-downloaded signed APK verified.')
          PY
          gh release edit v0.8.1 --draft=false --latest
          gh release view v0.8.1 --json url,tagName,isDraft,isPrerelease > "$RELEASE_DIRECTORY/publication.json"
      - name: Export completed public release and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mebot-official-0.8.1-delivery
          path: |
            ${{ runner.temp }}/mebot-release/
            website-evidence/
          retention-days: 14
          if-no-files-found: warn
